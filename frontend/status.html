<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your queue status — QueueFlow</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wrap">
    <p class="eyebrow" id="restaurant-name">QueueFlow</p>
    <h1>Your live position</h1>
    <p class="lede">This page updates on its own — no need to refresh. We'll also alert you on WhatsApp/email when you're close.</p>

    <div class="error-banner" id="error-banner"></div>

    <div id="content" style="display:none;">
      <span class="status-pill dot" id="status-pill">Waiting</span>

      <div class="board">
        <div class="board-row">
          <div class="board-block">
            <div class="board-label">Now serving</div>
            <div class="flap-group" id="serving-flaps"></div>
          </div>
          <div class="board-divider"></div>
          <div class="board-block">
            <div class="board-label">Your token</div>
            <div class="flap-group" id="mine-flaps"></div>
          </div>
        </div>
      </div>

      <div class="meta-grid">
        <div class="meta-card">
          <div class="meta-label">Orders ahead of you</div>
          <div class="meta-value" id="ahead-value">—</div>
        </div>
        <div class="meta-card">
          <div class="meta-label">Estimated wait</div>
          <div class="meta-value" id="wait-value">—</div>
        </div>
      </div>

      <button class="secondary" id="resend-btn">Resend my status by WhatsApp/email</button>
    </div>
  </div>

  <footer class="foot">QueueFlow — skip the standing, keep the seat.</footer>

  <script src="js/api.js"></script>
  <script src="js/flap.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const errorBanner = document.getElementById('error-banner');
    const content = document.getElementById('content');

    function showError(message) {
      errorBanner.textContent = message;
      errorBanner.classList.add('show');
    }

    if (!token) {
      showError('No token found in the link. Please rejoin the queue from the QR code on your table.');
    } else {
      const servingBoard = new FlapBoard(document.getElementById('serving-flaps'), 3);
      const mineBoard = new FlapBoard(document.getElementById('mine-flaps'), 3);
      const pill = document.getElementById('status-pill');
      const restaurantName = document.getElementById('restaurant-name');
      const aheadValue = document.getElementById('ahead-value');
      const waitValue = document.getElementById('wait-value');

      const STATUS_LABEL = {
        waiting: 'Waiting',
        almost_up: 'Almost up!',
        called: "It's your turn",
        served: 'Served',
        cancelled: 'Cancelled',
      };

      function render(status) {
        content.style.display = 'block';
        restaurantName.textContent = status.restaurantName;
        servingBoard.set(status.currentServing);
        mineBoard.set(status.orderNumber);
        aheadValue.textContent = status.ordersAhead;
        waitValue.textContent = `~${status.estimatedWaitMinutes} min`;

        pill.textContent = STATUS_LABEL[status.status] || status.status;
        pill.classList.toggle('warn', status.status === 'almost_up' || status.status === 'called');
      }

      async function poll() {
        try {
          const status = await apiRequest(`/api/status/${encodeURIComponent(token)}`);
          errorBanner.classList.remove('show');
          render(status);
        } catch (err) {
          showError(err.message);
        }
      }

      document.getElementById('resend-btn').addEventListener('click', async () => {
        try {
          await apiRequest(`/api/status/${encodeURIComponent(token)}/resend`, { method: 'POST' });
        } catch (err) {
          showError(err.message);
        }
      });

      poll();
      setInterval(poll, 5000);
    }
  </script>
</body>
</html>
